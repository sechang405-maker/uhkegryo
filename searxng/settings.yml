use_default_settings: true

server:
  # SEARXNG_SECRET env overrides the default secret key; settings.yml does not expand env vars.
  base_url: http://localhost:8080/

search:
  formats:
    - html
    - json

engines:
  - name: google images
    disabled: false
  - name: duckduckgo images
    disabled: false
  - name: pinterest
    disabled: false
