name: uhkegryo-portfolio-ollama-host

services:
  db:
    image: docker.io/postgres:17
    restart: "no"
    ports:
      - "127.0.0.1:${PORTFOLIO_DB_PORT:-55434}:5432"
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${PORTFOLIO_POSTGRES_PASSWORD:?Set the isolated portfolio password}
      POSTGRES_DB: portfolio
      TZ: UTC
      PGTZ: UTC
    volumes:
      - portfolio_ollama_host_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 3s
      timeout: 3s
      retries: 30

  db-migrate:
    build: .
    restart: "no"
    command: ["python", "-m", "backend.db.run_migrations"]
    environment:
      DATABASE_URL: postgresql://portfolio:${PORTFOLIO_POSTGRES_PASSWORD:?Set the isolated portfolio password}@db:5432/portfolio
    depends_on:
      db:
        condition: service_healthy

  searxng:
    image: uhkegryo-portfolio-ollama-host-searxng:local
    build: ./searxng
    restart: "no"
    ports:
      - "127.0.0.1:${PORTFOLIO_SEARXNG_PORT:-8081}:8080"
    environment:
      SEARXNG_SECRET: ${PORTFOLIO_SEARXNG_SECRET:?Set the isolated search secret}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  portfolio_ollama_host_postgres_data:
